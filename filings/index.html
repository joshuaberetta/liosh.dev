<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>filings · liosh.dev</title>
  <meta name="description" content="Iron filings on paper, simulated. A liosh project.">
  <meta name="theme-color" content="#0b0a12">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23ff7a59'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0b0a12;
      color: #f4efe6;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: "JetBrains Mono", ui-monospace, monospace;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    header {
      position: fixed;
      top: calc(1.25rem + env(safe-area-inset-top));
      left: 1.5rem;
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: 1.6rem;
      text-shadow: 0 0 10px #0b0a12, 0 0 20px #0b0a12;
    }

    header a { color: inherit; text-decoration: none; opacity: 0.55; }
    header a:hover { opacity: 1; }

    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(1rem + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      padding: 0 1rem;
    }

    button {
      font: inherit;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: #f4efe6;
      background: rgba(11, 10, 18, 0.7);
      border: 1px solid rgba(244, 239, 230, 0.18);
      border-radius: 999px;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    button:hover { border-color: rgba(244, 239, 230, 0.45); }
    button:active { transform: scale(0.97); }
    button[hidden] { display: none; }

    .hint {
      padding: 0 1.5rem;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      opacity: 0.5;
      text-shadow: 0 0 8px #0b0a12, 0 0 16px #0b0a12;
      pointer-events: none;
      transition: opacity 1.2s;
    }

    .hint.gone { opacity: 0; }

    .fallback {
      display: none;
      position: fixed;
      inset: 0;
      place-items: center;
      padding: 2rem;
      text-align: center;
      font-size: 0.8rem;
      line-height: 1.8;
      opacity: 0.7;
    }

    .fallback a { color: inherit; }
    .no-gl .fallback { display: grid; }
    .no-gl .controls, .no-gl .hint { display: none; }
  </style>
</head>
<body>
  <canvas id="view" aria-label="Simulated iron filings around magnets"></canvas>

  <header>
    <a href="/">liosh</a>
    <span>/ filings</span>
  </header>

  <footer>
    <p class="hint" id="hint"></p>
    <nav class="controls">
      <button data-action="tap">tap paper</button>
      <button data-action="layout">magnets: <span id="layout">bar</span></button>
      <button data-action="flip">hand: <span id="pole">N</span></button>
      <button data-action="scatter">scatter</button>
      <button data-action="motion" hidden>enable motion</button>
    </nav>
  </footer>

  <div class="fallback">
    <p>This needs WebGL2, which your browser doesn't seem to support.<br><a href="/">back to liosh</a></p>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
