<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>liosh.dev</title>
  <meta name="description" content="liosh — creative dev projects by Liam and Josh.">
  <meta name="theme-color" content="#0b0a12">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23ff7a59'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0b0a12;
      color: #f4efe6;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    main {
      position: relative;
      z-index: 1;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem;
      text-align: center;
      pointer-events: none;
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(4rem, 18vw, 12rem);
      line-height: 0.9;
      letter-spacing: -0.03em;
      mix-blend-mode: difference;
    }

    p {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: clamp(0.7rem, 2.6vw, 0.85rem);
      letter-spacing: 0.25em;
      text-transform: lowercase;
      opacity: 0.75;
      text-shadow: 0 0 6px #0b0a12, 0 0 12px #0b0a12, 0 0 24px #0b0a12;
    }

    .hint {
      position: fixed;
      bottom: calc(1.5rem + env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      font-size: 0.65rem;
      opacity: 0.4;
      transition: opacity 0.6s;
    }

    .hint[hidden] { display: block; opacity: 0; }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <main>
    <h1>liosh</h1>
    <p>liam + josh &middot; creative dev</p>
    <p class="hint" id="hint" hidden>tap to steer with tilt</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("field");
      const ctx = canvas.getContext("2d");
      const hint = document.getElementById("hint");
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Brightness buckets let thousands of filings render in a few stroke calls.
      const SHADES = [
        "rgba(150, 146, 160, 0.25)",
        "rgba(178, 174, 186, 0.45)",
        "rgba(206, 202, 210, 0.7)",
        "rgba(240, 236, 230, 0.95)",
      ];

      let w, h, unit, soft, filings, t = 0;

      // The user's magnet: follows the cursor, a touch, or the phone's tilt.
      const magnet = { x: 0, y: 0, tx: 0, ty: 0, strength: 0, active: false, polarity: 1 };
      let tilt = null;
      let touching = false;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        unit = Math.min(w, h);
        soft = (unit * 0.03) ** 2;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.round(Math.min(22000, (w * h) / 85));
        filings = Array.from({ length: count }, () => {
          const f = spawn({ angle: Math.random() * Math.PI });
          f.life = Math.random() * f.max;
          return f;
        });
        if (!magnet.active) magnet.x = magnet.tx = w / 2, magnet.y = magnet.ty = h / 2;
      }

      function spawn(f) {
        f.x = Math.random() * w;
        f.y = Math.random() * h;
        f.len = 3 + Math.random() * 6;
        f.ease = 0.06 + Math.random() * 0.1;
        f.life = 0;
        f.max = 500 + Math.random() * 900;
        return f;
      }

      // Two slowly wandering bar magnets (each a +/- pole pair) plus the user's magnet.
      function poles() {
        const list = [];
        const bar = (cx, cy, a, q) => {
          const s = unit * 0.11;
          list.push({ x: cx + Math.cos(a) * s, y: cy + Math.sin(a) * s, q });
          list.push({ x: cx - Math.cos(a) * s, y: cy - Math.sin(a) * s, q: -q });
        };
        bar(w * (0.28 + Math.sin(t * 0.13) * 0.08), h * (0.38 + Math.cos(t * 0.11) * 0.1), t * 0.07, 1);
        bar(w * (0.72 + Math.cos(t * 0.09) * 0.08), h * (0.64 + Math.sin(t * 0.12) * 0.1), Math.PI / 2 - t * 0.05, 1);
        if (magnet.strength > 0.001) {
          list.push({ x: magnet.x, y: magnet.y, q: 2.2 * magnet.strength * magnet.polarity });
        }
        return list;
      }

      function step(snap) {
        t += 0.016;

        const tx = tilt ? tilt.x : magnet.tx;
        const ty = tilt ? tilt.y : magnet.ty;
        const on = magnet.active || !!tilt;
        magnet.x += (tx - magnet.x) * 0.12;
        magnet.y += (ty - magnet.y) * 0.12;
        magnet.strength += ((on ? 1 : 0) - magnet.strength) * 0.05;

        const ps = poles();
        const paths = SHADES.map(() => new Path2D());

        for (const f of filings) {
          let bx = 0, by = 0, sink = false, pullSign = 0, strongest = 0;
          for (const p of ps) {
            const dx = f.x - p.x, dy = f.y - p.y;
            const r2 = dx * dx + dy * dy;
            if (r2 < soft * 0.3) sink = true;
            const k = p.q / (r2 + soft);
            bx += dx * k;
            by += dy * k;
            const s = Math.abs(p.q) / Math.sqrt(r2 + soft);
            if (s > strongest) strongest = s, pullSign = -Math.sign(p.q);
          }

          const mag = Math.hypot(bx, by);
          // Filings are unoriented: align to the field line, whichever way is closer.
          const target = Math.atan2(by, bx);
          let diff = target - f.angle;
          diff = ((diff + Math.PI / 2) % Math.PI + Math.PI) % Math.PI - Math.PI / 2;
          f.angle += snap ? diff : diff * f.ease;

          // Like real filings, creep along the field line toward the nearest pole.
          const pull = Math.min(mag * unit * 0.25, 1.2) * pullSign;
          if (mag > 0) {
            f.x += (bx / mag) * pull * 0.35;
            f.y += (by / mag) * pull * 0.35;
          }

          const fade = Math.min(1, f.life / 60, (f.max - f.life) / 60);
          const bright = (0.2 + 0.8 * (1 - Math.exp(-mag * unit * 0.9))) * fade;
          const shade = Math.min(SHADES.length - 1, (bright * SHADES.length) | 0);
          const half = f.len * (0.6 + bright * 0.6) / 2;
          const cx = Math.cos(f.angle) * half, cy = Math.sin(f.angle) * half;
          paths[shade].moveTo(f.x - cx, f.y - cy);
          paths[shade].lineTo(f.x + cx, f.y + cy);

          if (++f.life > f.max || sink || f.x < -10 || f.x > w + 10 || f.y < -10 || f.y > h + 10) spawn(f);
        }

        ctx.fillStyle = "#0b0a12";
        ctx.fillRect(0, 0, w, h);
        ctx.lineWidth = 1.1;
        ctx.lineCap = "round";
        paths.forEach((path, i) => {
          ctx.strokeStyle = SHADES[i];
          ctx.stroke(path);
        });
      }

      function loop() {
        step(false);
        requestAnimationFrame(loop);
      }

      // Reduced motion: no animation, just redraw a settled frame when input changes.
      let pending = false;
      function redraw() {
        if (!reduceMotion || pending) return;
        pending = true;
        requestAnimationFrame(() => {
          pending = false;
          magnet.strength = magnet.active || tilt ? 1 : 0;
          if (tilt) magnet.x = tilt.x, magnet.y = tilt.y;
          else magnet.x = magnet.tx, magnet.y = magnet.ty;
          for (const f of filings) f.life = 60;
          step(true);
        });
      }

      window.addEventListener("pointermove", (e) => {
        if (e.pointerType !== "mouse" && !touching) return;
        magnet.tx = e.clientX;
        magnet.ty = e.clientY;
        magnet.active = true;
        redraw();
      });

      document.addEventListener("pointerleave", () => { magnet.active = false; redraw(); });
      document.addEventListener("mouseout", (e) => { if (!e.relatedTarget) { magnet.active = false; redraw(); } });

      window.addEventListener("pointerdown", (e) => {
        // Click or tap flips the magnet's polarity.
        magnet.polarity *= -1;
        if (e.pointerType !== "mouse") {
          touching = true;
          magnet.tx = e.clientX;
          magnet.ty = e.clientY;
          magnet.active = true;
          if (!tilt) magnet.x = e.clientX, magnet.y = e.clientY;
          requestTiltPermission();
        }
        redraw();
      });

      window.addEventListener("pointerup", (e) => {
        if (e.pointerType === "mouse") return;
        touching = false;
        magnet.active = false;
        redraw();
      });
      window.addEventListener("pointercancel", () => { touching = false; magnet.active = false; });

      // Phone tilt steers the magnet like a marble rolling around the screen.
      function onOrientation(e) {
        if (e.beta == null || e.gamma == null || touching) {
          if (touching) tilt = null;
          return;
        }
        const clamp = (v) => Math.max(-1, Math.min(1, v));
        tilt = {
          x: w / 2 + clamp(e.gamma / 30) * w * 0.45,
          y: h / 2 + clamp((e.beta - 40) / 30) * h * 0.45,
        };
        hint.hidden = true;
        redraw();
      }

      const needsPermission = typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function";
      let asked = false;

      function requestTiltPermission() {
        if (!needsPermission || asked) return;
        asked = true;
        DeviceOrientationEvent.requestPermission()
          .then((state) => { if (state === "granted") window.addEventListener("deviceorientation", onOrientation); })
          .catch(() => {})
          .finally(() => { hint.hidden = true; });
      }

      if (needsPermission) {
        if (matchMedia("(pointer: coarse)").matches) hint.hidden = false;
      } else {
        window.addEventListener("deviceorientation", onOrientation);
      }

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { resize(); if (reduceMotion) redraw(); }, 150);
      });

      resize();
      if (reduceMotion) redraw();
      else requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
