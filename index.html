<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>liosh.dev</title>
  <meta name="description" content="liosh — creative dev projects by Liam and Josh.">
  <meta name="theme-color" content="#0b0a12">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23ff7a59'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0b0a12;
      color: #f4efe6;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    main {
      position: relative;
      z-index: 1;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem;
      text-align: center;
      pointer-events: none;
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(4rem, 18vw, 12rem);
      line-height: 0.9;
      letter-spacing: -0.03em;
      mix-blend-mode: difference;
    }

    p {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: clamp(0.7rem, 2.6vw, 0.85rem);
      letter-spacing: 0.25em;
      text-transform: lowercase;
      opacity: 0.75;
      text-shadow: 0 0 6px #0b0a12, 0 0 12px #0b0a12, 0 0 24px #0b0a12;
    }

    a {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: inherit;
      text-decoration: none;
      opacity: 0.55;
      pointer-events: auto;
      text-shadow: 0 0 6px #0b0a12, 0 0 12px #0b0a12;
      transition: opacity 0.3s;
    }

    a:hover { opacity: 1; }

    .hint {
      position: fixed;
      bottom: calc(1.5rem + env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      font-size: 0.65rem;
      opacity: 0.4;
      transition: opacity 0.6s;
    }

    .hint[hidden] { display: block; opacity: 0; }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <main>
    <h1>liosh</h1>
    <p>liam + josh &middot; creative dev</p>
    <a href="/filings/">filings &rarr;</a>
    <p class="hint" id="hint" hidden>tap to steer with tilt</p>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("field");
      const ctx = canvas.getContext("2d");
      const hint = document.getElementById("hint");
      const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Brightness buckets let thousands of filings render in a few stroke calls.
      const SHADES = [
        "rgba(150, 146, 160, 0.25)",
        "rgba(178, 174, 186, 0.45)",
        "rgba(206, 202, 210, 0.7)",
        "rgba(240, 236, 230, 0.95)",
      ];

      let w, h, unit, soft, filings, t = 0;

      // The user's magnet: follows the cursor, a touch, or the phone's tilt.
      const magnet = { x: 0, y: 0, tx: 0, ty: 0, strength: 0, active: false, polarity: 1 };
      let tilt = null;
      let touching = false;

      // The title is magnetized too: filings drift toward the letters and pile up on them.
      const TC = 3;          // text field grid cell, px
      let text = null;       // { gw, gh, mask, near, gx, gy, occ }

      function boxBlur(src, gw, gh, r) {
        const tmp = new Float32Array(src.length), out = new Float32Array(src.length);
        const norm = 1 / (2 * r + 1);
        for (let y = 0; y < gh; y++) {
          const row = y * gw;
          let sum = 0;
          for (let x = -r; x <= r; x++) sum += src[row + Math.min(gw - 1, Math.max(0, x))];
          for (let x = 0; x < gw; x++) {
            tmp[row + x] = sum * norm;
            sum += src[row + Math.min(gw - 1, x + r + 1)] - src[row + Math.max(0, x - r)];
          }
        }
        for (let x = 0; x < gw; x++) {
          let sum = 0;
          for (let y = -r; y <= r; y++) sum += tmp[Math.min(gh - 1, Math.max(0, y)) * gw + x];
          for (let y = 0; y < gh; y++) {
            out[y * gw + x] = sum * norm;
            sum += tmp[Math.min(gh - 1, y + r + 1) * gw + x] - tmp[Math.max(0, y - r) * gw + x];
          }
        }
        return out;
      }

      const blur = (src, gw, gh, r) => boxBlur(boxBlur(boxBlur(src, gw, gh, r), gw, gh, r), gw, gh, r);

      // Rasterize the title where it sits on screen, then blur it into a potential
      // whose gradient pulls filings in from afar and points straight out of the glyphs.
      function buildText() {
        const el = document.querySelector("h1");
        const rect = el.getBoundingClientRect();
        const fs = parseFloat(getComputedStyle(el).fontSize);
        const gw = Math.ceil(w / TC), gh = Math.ceil(h / TC);
        const off = document.createElement("canvas");
        off.width = gw;
        off.height = gh;
        const c = off.getContext("2d", { willReadFrequently: true });
        c.scale(1 / TC, 1 / TC);
        c.font = `italic 300 ${fs}px Fraunces, Georgia, serif`;
        if ("letterSpacing" in c) c.letterSpacing = `${-0.03 * fs}px`;
        c.textAlign = "center";
        const m = c.measureText(el.textContent);
        const asc = m.fontBoundingBoxAscent ?? fs * 0.95, desc = m.fontBoundingBoxDescent ?? fs * 0.25;
        c.fillText(el.textContent, rect.left + rect.width / 2, rect.top + (rect.height - asc - desc) / 2 + asc);

        const px = c.getImageData(0, 0, gw, gh).data;
        const mask = new Float32Array(gw * gh);
        for (let i = 0; i < mask.length; i++) mask[i] = px[i * 4 + 3] / 255;
        const near = blur(mask, gw, gh, Math.max(2, Math.round((fs * 0.05) / TC)));
        const far = blur(mask, gw, gh, Math.max(4, Math.round((fs * 0.3) / TC)));

        const gx = new Float32Array(gw * gh), gy = new Float32Array(gw * gh);
        let max = 1e-6;
        for (let y = 1; y < gh - 1; y++) {
          for (let x = 1; x < gw - 1; x++) {
            const i = y * gw + x;
            gx[i] = near[i + 1] - near[i - 1] + 1.5 * (far[i + 1] - far[i - 1]);
            gy[i] = near[i + gw] - near[i - gw] + 1.5 * (far[i + gw] - far[i - gw]);
            max = Math.max(max, Math.hypot(gx[i], gy[i]));
          }
        }
        for (let i = 0; i < gx.length; i++) gx[i] /= max, gy[i] /= max;
        text = { gw, gh, mask, near, gx, gy, occ: new Uint8Array(gw * gh) };
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        unit = Math.min(w, h);
        soft = (unit * 0.03) ** 2;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const count = Math.round(Math.min(22000, (w * h) / 85));
        filings = Array.from({ length: count }, () => {
          const f = spawn({ angle: Math.random() * Math.PI });
          f.life = Math.random() * f.max;
          return f;
        });
        if (!magnet.active) magnet.x = magnet.tx = w / 2, magnet.y = magnet.ty = h / 2;
        text = null;
        document.fonts.load("italic 300 100px Fraunces").finally(buildText);
      }

      function spawn(f) {
        if (f.stuck) unstick(f);
        do {
          f.x = Math.random() * w;
          f.y = Math.random() * h;
        } while (text && text.mask[cellAt(f.x, f.y)] > 0.1);
        f.len = 3 + Math.random() * 6;
        f.ease = 0.06 + Math.random() * 0.1;
        f.life = 0;
        f.max = 500 + Math.random() * 900;
        return f;
      }

      const cellAt = (x, y) =>
        Math.min(text.gh - 1, Math.max(0, (y / TC) | 0)) * text.gw + Math.min(text.gw - 1, Math.max(0, (x / TC) | 0));

      function stick(f, cell) {
        f.stuck = true;
        f.cell = cell;
        text.occ[cell]++;
        f.max = f.life + 2400 + Math.random() * 3600;
      }

      function unstick(f) {
        f.stuck = false;
        if (text && text.occ[f.cell]) text.occ[f.cell]--;
      }

      // Two slowly wandering bar magnets (each a +/- pole pair) plus the user's magnet.
      function poles() {
        const list = [];
        const bar = (cx, cy, a, q) => {
          const s = unit * 0.11;
          list.push({ x: cx + Math.cos(a) * s, y: cy + Math.sin(a) * s, q });
          list.push({ x: cx - Math.cos(a) * s, y: cy - Math.sin(a) * s, q: -q });
        };
        bar(w * (0.28 + Math.sin(t * 0.13) * 0.08), h * (0.38 + Math.cos(t * 0.11) * 0.1), t * 0.07, 1);
        bar(w * (0.72 + Math.cos(t * 0.09) * 0.08), h * (0.64 + Math.sin(t * 0.12) * 0.1), Math.PI / 2 - t * 0.05, 1);
        if (magnet.strength > 0.001) {
          list.push({ x: magnet.x, y: magnet.y, q: 2.2 * magnet.strength * magnet.polarity });
        }
        return list;
      }

      function step(snap) {
        t += 0.016;

        const tx = tilt ? tilt.x : magnet.tx;
        const ty = tilt ? tilt.y : magnet.ty;
        const on = magnet.active || !!tilt;
        magnet.x += (tx - magnet.x) * 0.12;
        magnet.y += (ty - magnet.y) * 0.12;
        magnet.strength += ((on ? 1 : 0) - magnet.strength) * 0.05;

        const ps = poles();
        const textB = 6 / unit;
        const wipe2 = (unit * 0.07) ** 2;
        const paths = SHADES.map(() => new Path2D());

        for (const f of filings) {
          let bx = 0, by = 0, sink = false, pullSign = 0, strongest = 0;
          for (const p of ps) {
            const dx = f.x - p.x, dy = f.y - p.y;
            const r2 = dx * dx + dy * dy;
            if (r2 < soft * 0.3) sink = true;
            const k = p.q / (r2 + soft);
            bx += dx * k;
            by += dy * k;
            const s = Math.abs(p.q) / Math.sqrt(r2 + soft);
            if (s > strongest) strongest = s, pullSign = -Math.sign(p.q);
          }

          // Near the title its field takes over, and filings that touch the
          // letters (or filings already stuck to them) stay put, so the pile grows.
          let tgx = 0, tgy = 0;
          if (text) {
            const cell = cellAt(f.x, f.y);
            tgx = text.gx[cell];
            tgy = text.gy[cell];
            bx += tgx * textB;
            by += tgy * textB;
            if (f.stuck) {
              const dx = f.x - magnet.x, dy = f.y - magnet.y;
              if (magnet.strength > 0.3 && dx * dx + dy * dy < wipe2) unstick(f);
            } else if (text.mask[cell] > 0.4) {
              stick(f, cell);
            } else if (Math.random() < Math.min(0.35, text.near[cell] * 1.2)) {
              // Fur gets sparser further from the letters, so the pile tapers off.
              const { occ, gw } = text;
              if (occ[cell] || occ[cell - 1] || occ[cell + 1] || occ[cell - gw] || occ[cell + gw]) stick(f, cell);
            }
          }

          const mag = Math.hypot(bx, by);
          // Filings are unoriented: align to the field line, whichever way is closer.
          const target = Math.atan2(by, bx);
          let diff = target - f.angle;
          diff = ((diff + Math.PI / 2) % Math.PI + Math.PI) % Math.PI - Math.PI / 2;
          f.angle += snap ? diff : diff * f.ease;

          // Like real filings, creep along the field line toward the nearest pole,
          // and up the title's field toward the letters.
          if (!f.stuck) {
            const pull = Math.min(mag * unit * 0.25, 1.2) * pullSign;
            if (mag > 0) {
              f.x += (bx / mag) * pull * 0.35 + tgx * 1.2;
              f.y += (by / mag) * pull * 0.35 + tgy * 1.2;
            }
          }

          const fade = Math.min(1, f.life / 60, (f.max - f.life) / 60);
          const bright = (f.stuck ? 1 : 0.2 + 0.8 * (1 - Math.exp(-mag * unit * 0.9))) * fade;
          const shade = Math.min(SHADES.length - 1, (bright * SHADES.length) | 0);
          const half = f.len * (0.6 + bright * 0.6) / 2;
          const cx = Math.cos(f.angle) * half, cy = Math.sin(f.angle) * half;
          paths[shade].moveTo(f.x - cx, f.y - cy);
          paths[shade].lineTo(f.x + cx, f.y + cy);

          if (++f.life > f.max || (sink && !f.stuck) || f.x < -10 || f.x > w + 10 || f.y < -10 || f.y > h + 10) spawn(f);
        }

        ctx.fillStyle = "#0b0a12";
        ctx.fillRect(0, 0, w, h);
        ctx.lineWidth = 1.1;
        ctx.lineCap = "round";
        paths.forEach((path, i) => {
          ctx.strokeStyle = SHADES[i];
          ctx.stroke(path);
        });
      }

      function loop() {
        step(false);
        requestAnimationFrame(loop);
      }

      // Reduced motion: no animation, just redraw a settled frame when input changes.
      let pending = false;
      function redraw() {
        if (!reduceMotion || pending) return;
        pending = true;
        requestAnimationFrame(() => {
          pending = false;
          magnet.strength = magnet.active || tilt ? 1 : 0;
          if (tilt) magnet.x = tilt.x, magnet.y = tilt.y;
          else magnet.x = magnet.tx, magnet.y = magnet.ty;
          for (const f of filings) f.life = 60;
          step(true);
        });
      }

      window.addEventListener("pointermove", (e) => {
        if (e.pointerType !== "mouse" && !touching) return;
        magnet.tx = e.clientX;
        magnet.ty = e.clientY;
        magnet.active = true;
        redraw();
      });

      document.addEventListener("pointerleave", () => { magnet.active = false; redraw(); });
      document.addEventListener("mouseout", (e) => { if (!e.relatedTarget) { magnet.active = false; redraw(); } });

      window.addEventListener("pointerdown", (e) => {
        if (e.target.closest("a")) return;
        // Click or tap flips the magnet's polarity.
        magnet.polarity *= -1;
        if (e.pointerType !== "mouse") {
          touching = true;
          magnet.tx = e.clientX;
          magnet.ty = e.clientY;
          magnet.active = true;
          if (!tilt) magnet.x = e.clientX, magnet.y = e.clientY;
          requestTiltPermission();
        }
        redraw();
      });

      window.addEventListener("pointerup", (e) => {
        if (e.pointerType === "mouse") return;
        touching = false;
        magnet.active = false;
        redraw();
      });
      window.addEventListener("pointercancel", () => { touching = false; magnet.active = false; });

      // Phone tilt steers the magnet like a marble rolling around the screen.
      function onOrientation(e) {
        if (e.beta == null || e.gamma == null || touching) {
          if (touching) tilt = null;
          return;
        }
        const clamp = (v) => Math.max(-1, Math.min(1, v));
        tilt = {
          x: w / 2 + clamp(e.gamma / 30) * w * 0.45,
          y: h / 2 + clamp((e.beta - 40) / 30) * h * 0.45,
        };
        hint.hidden = true;
        redraw();
      }

      const needsPermission = typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function";
      let asked = false;

      function requestTiltPermission() {
        if (!needsPermission || asked) return;
        asked = true;
        DeviceOrientationEvent.requestPermission()
          .then((state) => { if (state === "granted") window.addEventListener("deviceorientation", onOrientation); })
          .catch(() => {})
          .finally(() => { hint.hidden = true; });
      }

      if (needsPermission) {
        if (matchMedia("(pointer: coarse)").matches) hint.hidden = false;
      } else {
        window.addEventListener("deviceorientation", onOrientation);
      }

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { resize(); if (reduceMotion) redraw(); }, 150);
      });

      resize();
      if (reduceMotion) redraw();
      else requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
