<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>liosh.dev</title>
  <meta name="description" content="liosh — creative dev projects by Liam and Josh.">
  <meta name="theme-color" content="#0b0a12">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23ff7a59'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0b0a12;
      color: #f4efe6;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    main {
      position: relative;
      z-index: 1;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem;
      text-align: center;
      pointer-events: none;
    }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(4rem, 18vw, 12rem);
      line-height: 0.9;
      letter-spacing: -0.03em;
      mix-blend-mode: difference;
    }

    .block {
      display: inline-block;
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
      will-change: transform;
    }

    .dragging, .dragging * { cursor: grabbing; }

    p {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: clamp(0.7rem, 2.6vw, 0.85rem);
      letter-spacing: 0.25em;
      text-transform: lowercase;
      opacity: 0.75;
      text-shadow: 0 0 6px #0b0a12, 0 0 12px #0b0a12, 0 0 24px #0b0a12;
    }

    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(1rem + env(safe-area-inset-bottom));
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      padding: 0 1rem;
      text-align: center;
    }

    .hint {
      font-size: 0.65rem;
      opacity: 0.5;
      transition: opacity 0.6s;
    }

    .hint[hidden] { display: block; opacity: 0; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
    }

    .controls > * {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: #f4efe6;
      background: rgba(11, 10, 18, 0.7);
      border: 1px solid rgba(244, 239, 230, 0.18);
      border-radius: 999px;
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    .controls > *:hover { border-color: rgba(244, 239, 230, 0.45); }
    .controls > [aria-pressed="true"] { border-color: #ff7a59; color: #ff7a59; }
    .pour-mode canvas { cursor: cell; }
    button:active { transform: scale(0.97); }

    input[type="range"] {
      width: 6.5rem;
      accent-color: #ff7a59;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <main>
    <h1 class="block" data-pole="N">liosh</h1>
    <p>
      <span class="block" data-pole="S">liam</span>
      <span class="block" data-pole="S">+</span>
      <span class="block" data-pole="S">josh</span>
      <span class="block" data-pole="S">&middot;</span>
      <span class="block" data-pole="S">creative</span>
      <span class="block" data-pole="S">dev</span>
    </p>
  </main>

  <footer>
    <p class="hint" id="hint" hidden>tap to enable motion</p>
    <nav class="controls">
      <button data-action="tap">tap paper</button>
      <label>words <input type="range" id="letters" min="0" max="3" step="0.05" value="1" aria-label="Word magnet strength"></label>
      <button data-action="flip">hand: <span id="pole">N</span></button>
      <button data-action="pour" aria-pressed="false">pour</button>
      <button data-action="scatter">scatter</button>
      <button data-action="recenter">recenter</button>
    </nav>
  </footer>

  <script type="module" src="home.js"></script>
</body>
</html>
